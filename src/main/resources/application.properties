# ==========================================
# MySQL Database Connection Settings
# ==========================================
# Connecting via the internal Kubernetes Service name inside the "project" namespace
# Replace "mysql" with your actual database name from Step 1 (or use "mysql" as the default)
spring.datasource.url=jdbc:mysql://mysql.project.svc.cluster.local:3306/mysql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# The default administrative user for MySQL
spring.datasource.username=root

# Replace "root" below with the actual password found in Step 1 (often "root", "rootpassword", or "1234")
spring.datasource.password=root123

# MySQL Connector Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configurations
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
