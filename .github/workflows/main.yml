name: Backend Build & Push (Auto Versioned)

permissions:
  contents: write   # REQUIRED to create & push git tags

on:
  push:
    branches:
      - dev
      - test
      - demo
      - prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout full history (needed for tags)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Determine branch name
      - name: Set branch name
        run: |
          BRANCH=${GITHUB_REF##*/}
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # 3️⃣ Get latest semantic version for this branch
      - name: Calculate next version
        run: |
          git fetch --tags

          LAST_TAG=$(git tag -l "${BRANCH}-v*" | sort -V | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            VERSION="v1.0.0"
          else
            BASE_VERSION=${LAST_TAG#*-v}
            IFS='.' read MAJOR MINOR PATCH <<< "$BASE_VERSION"
            PATCH=$((PATCH + 1))
            VERSION="v$MAJOR.$MINOR.$PATCH"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=${BRANCH}-$VERSION" >> $GITHUB_ENV

      # 4️⃣ Create and push git tag
      - name: Create git tag
        run: |
          git tag "${IMAGE_TAG}"
          git push origin "${IMAGE_TAG}"

      # 5️⃣ Docker login
      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # 6️⃣ Build backend Docker image
      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:${{ env.IMAGE_TAG }} .

      # 7️⃣ Push backend Docker image
      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/backend:${{ env.IMAGE_TAG }}


      # 8️⃣ Success log
      - name: Success
        run: |
          echo "✅ Backend image built and pushed:"
          echo "${{ secrets.DOCKER_USERNAME }}/backend:${{ env.IMAGE_TAG }}"
