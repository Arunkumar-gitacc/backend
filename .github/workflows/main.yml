name: Backend CI - Build & Trigger Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build backend image
        run: |
          docker build \
            -t arunkumar885825/backend:${IMAGE_TAG} \
            -t arunkumar885825/backend:latest \
            .

      - name: Push backend image
        run: |
          docker push arunkumar885825/backend:${IMAGE_TAG}
          docker push arunkumar885825/backend:latest

      - name: Trigger deployment
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.DEPLOYMENT_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/arunkumar-gitacc/deployment/dispatches \
            -d '{
              "event_type": "backend_updated",
              "client_payload": {
                "backend_tag": "'"${IMAGE_TAG}"'"
              }
            }'
