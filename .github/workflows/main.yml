name: Backend CI - Build & Trigger Deploy (with SonarQube)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------
      # 1️⃣ CHECKOUT CODE
      # -----------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------
      # 2️⃣ SETUP JAVA
      # -----------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -----------------------
      # 3️⃣ SONARQUBE SCAN (JAVA EXCLUDED)
      # -----------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=backend
            -Dsonar.projectName=backend
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*.java,**/target/**,**/node_modules/**
            -Dsonar.sourceEncoding=UTF-8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -----------------------
      # 4️⃣ SONARQUBE QUALITY GATE
      # -----------------------
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -----------------------
      # 5️⃣ LOGIN TO DOCKER HUB
      # -----------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------
      # 6️⃣ SET IMAGE TAG
      # -----------------------
      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # -----------------------
      # 7️⃣ BUILD BACKEND IMAGE
      # -----------------------
      - name: Build backend image
        run: |
          docker build \
            -t arunkumar885825/backend:${IMAGE_TAG} \
            -t arunkumar885825/backend:latest \
            .

      # -----------------------
      # 8️⃣ PUSH BACKEND IMAGE
      # -----------------------
      - name: Push backend image
        run: |
          docker push arunkumar885825/backend:${IMAGE_TAG}
          docker push arunkumar885825/backend:latest

      # -----------------------
      # 9️⃣ TRIGGER DEPLOYMENT
      # -----------------------
      - name: Trigger deployment pipeline
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.DEPLOYMENT_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/arunkumar-gitacc/deployment/dispatches \
            -d '{
              "event_type": "backend_updated",
              "client_payload": {
                "backend_tag": "'"${IMAGE_TAG}"'"
              }
            }'
