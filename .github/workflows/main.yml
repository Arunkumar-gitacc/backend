name: Frontend CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend1 Image
        run: |
          docker build -t arunkumar885825/frontend:${{ github.sha }} .
          docker push arunkumar885825/frontend:${{ github.sha }}

      - name: Trigger deployment update
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.DEPLOYMENT_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/arunkumar-create/deployment/dispatches \
            -d '{"event_type":"frontend_updated","client_payload":{"tag":"'"${{ github.sha }}"'"}}'
