name: Backend Build & Push (Auto Versioned)

permissions:
  contents: write

on:
  push:
    branches: [dev, test, demo, prod]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set branch name
        run: |
          BRANCH=${GITHUB_REF##*/}
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Calculate next version
        run: |
          git fetch --tags
          LAST_TAG=$(git tag -l "${BRANCH}-v*" | sort -V | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            VERSION="v1.0.0"
          else
            BASE_VERSION=${LAST_TAG#*-v}
            IFS='.' read MAJOR MINOR PATCH <<< "$BASE_VERSION"
            PATCH=$((PATCH + 1))
            VERSION="v$MAJOR.$MINOR.$PATCH"
          fi

          IMAGE_TAG="${BRANCH}-${VERSION}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create git tag
        run: |
          if git rev-parse "${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${IMAGE_TAG} already exists, skipping"
          else
            git tag "${IMAGE_TAG}"
            git push origin "${IMAGE_TAG}"
          fi

      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      
      - name: Build backend image
        env:
         IMAGE: "${{ secrets.DOCKER_USERNAME }}/backend:${{ env.IMAGE_TAG }}"
        run: docker build -t "$IMAGE" .


      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:${{ env.IMAGE_TAG }}

      - name: Success
        run: |
          echo "✅ Backend image built and pushed:"
          echo "${{ secrets.DOCKER_USERNAME }}/backend:${{ env.IMAGE_TAG }}"
